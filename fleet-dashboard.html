<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet Dashboard — 船隊監控總覽</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/src/fleet/style-fleet.css" />
</head>
<body>

  <!-- KPI Sticky Header -->
  <header id="fleet-kpi-header" class="fleet-kpi-header"></header>

  <main class="fleet-main">

    <!-- ① 策略分析層 -->
    <section class="fleet-layer fleet-layer--strategy">
      <div class="fleet-layer-head">
        <div class="fleet-layer-head-left">
          <span class="fleet-layer-badge fleet-layer-badge--strategy">&#128202; 策略分析層</span>
          <span class="fleet-layer-sub">決策依據 &middot; 趨勢洞察 &middot; 效率排名</span>
        </div>
      </div>
      <div id="fleet-strategy-panel"></div>
    </section>

    <!-- 分層視覺分隔線 -->
    <div class="fleet-layer-divider" aria-hidden="true"></div>

    <!-- ② 現況監控層 -->
    <section class="fleet-layer fleet-layer--live">
      <div class="fleet-layer-head">
        <div class="fleet-layer-head-left">
          <span class="fleet-layer-badge fleet-layer-badge--live">&#128752; 現況監控層</span>
          <span class="fleet-layer-sub">即時動態 &middot; 風險警示</span>
        </div>
        <button class="fleet-risk-toggle"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#fleet-risk-panel-wrap"
                aria-expanded="true">
          &#9888;&#65039; 風險面板
        </button>
      </div>
      <div class="row g-4">
        <div class="col-12 col-lg-8" id="fleet-live-panel"></div>
        <div class="col-12 col-lg-4">
          <div class="collapse show" id="fleet-risk-panel-wrap">
            <div id="fleet-risk-panel"></div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <script type="module" src="/src/fleet/main-fleet.js"></script>
</body>
</html>
