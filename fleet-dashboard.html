<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet Dashboard — 船隊監控總覽</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/src/fleet/style-fleet.css" />
</head>
<body>

  <!-- KPI Fixed Header -->
  <header id="fleet-kpi-header" class="fleet-kpi-header"></header>

  <!-- Main Content -->
  <main class="fleet-main">

    <!-- Tab Navigation -->
    <nav class="fleet-tab-nav">
      <ul class="nav nav-tabs fleet-tabs" id="fleet-tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="tab-strategy-btn"
            data-bs-toggle="tab" data-bs-target="#tab-strategy"
            type="button" role="tab">
            &#128202; 策略分析
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-live-btn"
            data-bs-toggle="tab" data-bs-target="#tab-live"
            type="button" role="tab">
            &#128752; 即時動態
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-risk-btn"
            data-bs-toggle="tab" data-bs-target="#tab-risk"
            type="button" role="tab">
            &#9888;&#65039; 風險面板
          </button>
        </li>
      </ul>
    </nav>

    <!-- Tab Panes -->
    <div class="tab-content fleet-tab-content" id="fleet-tab-content">
      <div class="tab-pane fade show active" id="tab-strategy" role="tabpanel"></div>
      <div class="tab-pane fade" id="tab-live" role="tabpanel"></div>
      <div class="tab-pane fade" id="tab-risk" role="tabpanel"></div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/fleet/main-fleet.js"></script>
</body>
</html>
