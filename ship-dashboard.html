<!doctype html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>單船決策支援儀表板</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/src/ship/style-ship.css" />
</head>

<body>
  <div id="app">
    <div id="main-area">
      <div class="container-fluid h-100 p-0">
        <div class="row h-100 g-0">

          <!-- 左側船隻清單 -->
          <aside class="col-12 col-md-2 h-100" id="ship-list-pane"></aside>

          <!-- 主要內容區 -->
          <div class="col-12 col-md-10 h-100" id="main-content">

            <!-- 頂部：船隻總覽 -->
            <div id="ship-overview-pane"></div>

            <!-- 中部：地圖 + 時間軸 | 事件清單 -->
            <div class="row g-0" id="mid-row">
              <div class="col-12 col-lg-8">
                <div id="map-panel-pane"></div>
                <div id="timeline-bar"></div>
              </div>
              <div class="col-12 col-lg-4">
                <div id="event-list-pane"></div>
              </div>
            </div>

            <!-- 底部：船員資訊 | 風險評估 -->
            <div class="row g-0" id="bottom-row">
              <div class="col-12 col-md-5" id="crew-panel-pane"></div>
              <div class="col-12 col-md-7" id="risk-panel-pane"></div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/src/ship/main-ship.js"></script>
</body>

</html>
