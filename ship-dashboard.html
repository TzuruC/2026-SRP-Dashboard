<!doctype html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>單船決策支援儀表板</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/src/ship/style-ship.css" />
</head>

<body>
  <div id="app">
    <div id="main-area">
      <div class="container-fluid h-100 p-0">
        <div class="row h-100 g-0">

          <!-- 左側船隻清單 -->
          <aside class="col-12 col-md-2 h-100" id="ship-list-pane"></aside>

          <!-- 主要內容區 -->
          <div class="col-12 col-md-10 h-100" id="main-content">

            <!-- 船隻總覽 -->
            <div id="ship-overview-pane"></div>

            <!-- ══ VOYAGE 航程 ══════════════════════════════ -->
            <div class="section-divider section-divider--voyage">
              <span>⚓ VOYAGE 航程</span>
              <span class="section-divider-sub">出發 → ETA（0 – 24h）</span>
            </div>

            <div class="row g-0">
              <div class="col-12 col-lg-8">
                <div id="map-panel-pane"></div>
                <div id="voyage-timeline-bar"></div>
              </div>
              <div class="col-12 col-lg-4">
                <div id="voyage-event-pane"></div>
              </div>
            </div>

            <!-- ══ PORT 港口作業 ════════════════════════════ -->
            <div class="section-divider section-divider--port">
              <span>🏭 PORT 港口作業</span>
              <span class="section-divider-sub">ETA → ETA + 72h</span>
            </div>

            <div class="row g-0" id="port-row">
              <div class="col-12 col-md-5">
                <div id="port-timeline-bar"></div>
                <div id="port-event-pane"></div>
              </div>
              <div class="col-12 col-md-4" id="crew-panel-pane"></div>
              <div class="col-12 col-md-3" id="risk-panel-pane"></div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/src/ship/main-ship.js"></script>
</body>

</html>
