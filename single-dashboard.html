<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>單船決策支援儀表板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/src/single/style-single.css" />
  </head>
  <body>
    <div id="app">
      <div id="main-area">
        <div class="container-fluid h-100 p-0">
          <div class="row h-100 g-0">
            <aside class="col-2 h-100" id="ship-list-pane"></aside>
            <div class="col-10 h-100" id="main-content">
              <div id="ship-overview-pane"></div>
              <div class="row g-0" id="mid-row">
                <div class="col-4" id="map-panel-pane"></div>
                <div class="col-8" id="risk-panel-pane"></div>
              </div>
              <div class="row g-0" id="bottom-row">
                <div class="col-7" id="event-list-pane"></div>
                <div class="col-5" id="crew-panel-pane"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="timeline-bar"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="/src/single/main-single.js"></script>
  </body>
</html>
